name: Build AuRaw

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  DEBIAN_FRONTEND: noninteractive

jobs:
  linux-appimage:
    name: Linux AppImage
    runs-on: ubuntu-latest
    env:
      LIBRAW_PREFIX: /tmp/auraw-libraw
      PKG_CONFIG_PATH: /tmp/auraw-libraw/lib/pkgconfig
      LD_LIBRARY_PATH: /tmp/auraw-libraw/lib

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Restore Linux build cache
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            /tmp/auraw-libraw
            /tmp/linuxdeploy-x86_64.AppImage
          key: auraw-linux-${{ runner.os }}-${{ runner.arch }}-rust-1.92.0-libraw-823f25d-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'build.rs') }}
          restore-keys: |
            auraw-linux-${{ runner.os }}-${{ runner.arch }}-rust-1.92.0-libraw-823f25d-

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          if [ "$(id -u)" -eq 0 ]; then
            SUDO=""
          else
            SUDO="sudo"
          fi

          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            build-essential \
            autoconf \
            automake \
            ca-certificates \
            clang \
            curl \
            file \
            libasound2-dev \
            libclang-dev \
            libdbus-1-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            libjpeg-dev \
            liblcms2-dev \
            liblensfun-dev \
            liblensfun-data-v1 \
            libtool \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxkbcommon-dev \
            patchelf \
            pkg-config \
            python3 \
            squashfs-tools \
            wget \
            zlib1g-dev

      - name: Build release binary
        shell: bash
        run: |
          set -euxo pipefail

          bootstrap_download_verified() {
            python3 scripts/bootstrap_download.py "$1" "$2" "$3"
          }

          bootstrap_download_verified \
            https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
            /tmp/rustup-init \
            https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init.sha256
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --profile minimal --default-toolchain 1.92.0
          source "$HOME/.cargo/env"

          AURAW_LIBRAW_REVISION="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["metadata"]["libraw_revision"])')"
          LIBRAW_SOURCE_REVISION=b860248a89d9082b8e0a1e202e516f46af9adb29
          LIBRAW_ARCHIVE_SHA256=f5da1e522ea195b54b30f3ff105ef2193daa04ea165dea825b4d6fe9d886395b
          if [ -f "$LIBRAW_PREFIX/lib/pkgconfig/libraw.pc" ] \
            && [ -f "$LIBRAW_PREFIX/lib/libraw.so" ] \
            && [ "$(pkg-config --modversion libraw)" = "$AURAW_LIBRAW_REVISION" ]; then
            echo "Using cached desktop LibRaw $LIBRAW_SOURCE_REVISION"
          else
            rm -rf /tmp/auraw-libraw-src "$LIBRAW_PREFIX"
            mkdir -p /tmp/auraw-libraw-src
            python3 scripts/bootstrap_download.py \
              "https://github.com/LibRaw/LibRaw/archive/$LIBRAW_SOURCE_REVISION.tar.gz" \
              /tmp/auraw-libraw.tar.gz "$LIBRAW_ARCHIVE_SHA256"
            tar -xzf /tmp/auraw-libraw.tar.gz \
              --strip-components=1 \
              -C /tmp/auraw-libraw-src
            (
              cd /tmp/auraw-libraw-src
              autoreconf --install --force
              ./configure --prefix="$LIBRAW_PREFIX"
              make --jobs="$(nproc)"
              make install
            )
          fi

          LIBCLANG_SO="$(find /usr/lib -path '*/llvm-*/lib/libclang.so*' -print -quit 2>/dev/null || true)"
          if [ -n "$LIBCLANG_SO" ]; then
            export LIBCLANG_PATH="$(dirname "$LIBCLANG_SO")"
          fi

          test "$(pkg-config --modversion libraw)" = "$AURAW_LIBRAW_REVISION"
          pkg-config --modversion lensfun
          REVISION="$(git rev-parse --verify HEAD)"
          export AURAW_REQUIRE_COMMITTED_SOURCE=1
          export AURAW_SOURCE_REVISION="$REVISION"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$REVISION")"

          cargo build --release --locked
          strip target/release/auraw

          ldd target/release/auraw | tee /tmp/auraw-ldd.txt
          grep -Eq 'libraw(_r)?\.so' /tmp/auraw-ldd.txt
          grep -Eq 'liblensfun\.so' /tmp/auraw-ldd.txt

      - name: Package AppImage
        shell: bash
        run: |
          set -euxo pipefail

          # Environment
          source "$HOME/.cargo/env"

          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$VERSION"

          LIBRAW_SO="$(ldd target/release/auraw | awk '/libraw(_r)?\.so/{print $3; exit}')"
          LENSFUN_SO="$(ldd target/release/auraw | awk '/liblensfun\.so/{print $3; exit}')"
          test -f "$LIBRAW_SO"
          test -f "$LENSFUN_SO"
          echo "Bundling LibRaw from $LIBRAW_SO"
          echo "Bundling Lensfun from $LENSFUN_SO"

          LENSFUN_DB="$(find /usr/share/lensfun -type f -name '*.xml' -printf '%h\n' | head -n 1)"
          test -n "$LENSFUN_DB"

          rm -rf AppDir dist appimage-packaging
          mkdir -p dist appimage-packaging AppDir/usr/share/auraw/lensfun AppDir/usr/share/doc/auraw
          install -m 0644 COPYING NOTICE.md THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.md \
            AppDir/usr/share/doc/auraw/
          cp -a "$LENSFUN_DB"/. AppDir/usr/share/auraw/lensfun/
          test -n "$(find AppDir/usr/share/auraw/lensfun -name '*.xml' -print -quit)"

          APP_ID=de.duecki.auraw
          DESKTOP_FILE="$PWD/packaging/linux/$APP_ID.desktop"
          APPIMAGE_ICON="$PWD/appimage-packaging/$APP_ID.png"
          test -s "$DESKTOP_FILE"
          grep -qx "Icon=$APP_ID" "$DESKTOP_FILE"
          grep -qx "StartupWMClass=$APP_ID" "$DESKTOP_FILE"

          install -m 0644 packaging/icons/auraw-256.png "$APPIMAGE_ICON"
          install -m 0644 "$DESKTOP_FILE" "AppDir/$APP_ID.desktop"
          install -Dm 0644 "$DESKTOP_FILE" \
            "AppDir/usr/share/applications/$APP_ID.desktop"
          install -m 0644 "$APPIMAGE_ICON" "AppDir/$APP_ID.png"
          install -Dm 0644 "$APPIMAGE_ICON" \
            "AppDir/usr/share/icons/hicolor/256x256/apps/$APP_ID.png"
          ln -s "$APP_ID.png" AppDir/.DirIcon
          test -s "$APPIMAGE_ICON"
          test -L AppDir/.DirIcon

          LINUXDEPLOY_SHA256=c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d
          python3 scripts/bootstrap_download.py \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage \
            /tmp/linuxdeploy-x86_64.AppImage "$LINUXDEPLOY_SHA256"
          chmod +x /tmp/linuxdeploy-x86_64.AppImage

          export APPIMAGE_EXTRACT_AND_RUN=1
          export LDAI_OUTPUT="AuRaw-${VERSION}-x86_64.AppImage"
          /tmp/linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable "$PWD/target/release/auraw" \
            --library "$LIBRAW_SO" \
            --library "$LENSFUN_SO" \
            --desktop-file "$DESKTOP_FILE" \
            --icon-file "$APPIMAGE_ICON" \
            --output appimage

          mv "$LDAI_OUTPUT" dist/
          chmod +x "dist/$LDAI_OUTPUT"
          file "dist/$LDAI_OUTPUT"

          sha256sum "dist/$LDAI_OUTPUT" > "dist/$LDAI_OUTPUT.sha256"

      - name: Upload AppImage
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: auraw-linux-appimage
          path: dist/*
          if-no-files-found: error

  android-debug-apk:
    name: Android debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Restore pinned Android toolchains
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c
        with:
          path: |
            ~/android-sdk
            ~/.gradle/wrapper
            ~/.cargo/bin/cargo-ndk
            ~/.cargo/bin/cargo-ndk-env
            ~/.cargo/bin/cargo-ndk-runner
            ~/.cargo/bin/cargo-ndk-test
          key: auraw-android-tools-${{ runner.os }}-${{ runner.arch }}-arm64-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'gradle/wrapper/gradle-wrapper.properties', 'scripts/bootstrap_download.py', 'xtask/src/main.rs') }}-v2

      - name: Restore Android dependency and build cache
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ~/.gradle/caches
            ~/.gradle/notifications
            android/.gradle
          key: auraw-android-build-${{ runner.os }}-${{ runner.arch }}-arm64-rust-1.92.0-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'build.rs', 'android/build.gradle', 'android/app/build.gradle') }}
          restore-keys: |
            auraw-android-build-${{ runner.os }}-${{ runner.arch }}-arm64-rust-1.92.0-

      - name: Restore Android native dependency cache
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c
        with:
          path: android/native
          key: android-native-deps-v1-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'android/app/src/main/cpp/CMakeLists.txt', 'xtask/src/main.rs') }}
          restore-keys: |
            android-native-deps-v1-${{ runner.os }}-

      - name: Set up Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android and native build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          if [ "$(id -u)" -eq 0 ]; then
            SUDO=""
          else
            SUDO="sudo"
          fi

          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            clang \
            curl \
            libclang-dev \
            pkg-config \
            tar \
            unzip \
            zip

      - name: Build arm64 debug APK
        shell: bash
        run: |
          set -euxo pipefail

          bootstrap_download_verified() {
            python3 scripts/bootstrap_download.py "$1" "$2" "$3"
          }

          # CMake's ExternalProject download previously fell through to
          # ftp.gnu.org, which is unreachable from this Gitea runner. Fetch
          # the immutable libiconv archive here with retries and a hard hash,
          # then let CMake use the cached local file. Prefer an immutable
          # GitHub mirror (GitHub is already required by this build), with a
          # direct kernel.org GNU mirror as a second source.
          mkdir -p android/native/downloads
          if ! bootstrap_download_verified \
            https://github.com/neovim/deps/raw/b9bf36eb31f27e8136d907da38fa23518927737e/opt/libiconv-1.17.tar.gz \
            android/native/downloads/libiconv-1.17.tar.gz \
            8f74213b56238c85a50a5329f77e06198771e70dd9a739779f4c02f65d971313; then
            bootstrap_download_verified \
              https://mirrors.edge.kernel.org/gnu/libiconv/libiconv-1.17.tar.gz \
              android/native/downloads/libiconv-1.17.tar.gz \
              8f74213b56238c85a50a5329f77e06198771e70dd9a739779f4c02f65d971313
          fi

          bootstrap_download_verified \
            https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
            /tmp/rustup-init \
            https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init.sha256
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --profile minimal --default-toolchain 1.92.0
          source "$HOME/.cargo/env"
          rustup target add aarch64-linux-android
          if [ "$(cargo ndk --version 2>/dev/null || true)" != "cargo-ndk 4.1.2" ]; then
            cargo install cargo-ndk --version 4.1.2 --locked
          fi

          build_metadata="$(cargo metadata --locked --no-deps --format-version 1)"
          export AURAW_ANDROID_COMPILE_SDK="$(printf '%s' "$build_metadata" | python3 -c 'import json,sys; print(json.load(sys.stdin)["metadata"]["android_compile_sdk"])')"
          export AURAW_ANDROID_BUILD_TOOLS_VERSION="$(printf '%s' "$build_metadata" | python3 -c 'import json,sys; print(json.load(sys.stdin)["metadata"]["android_build_tools_version"])')"
          export AURAW_ANDROID_NDK_VERSION="$(printf '%s' "$build_metadata" | python3 -c 'import json,sys; print(json.load(sys.stdin)["metadata"]["android_ndk_version"])')"

          install_sdk_packages() {
            local attempt
            for attempt in 1 2 3 4; do
              if sdkmanager \
                "platform-tools" \
                "platforms;android-$AURAW_ANDROID_COMPILE_SDK" \
                "build-tools;$AURAW_ANDROID_BUILD_TOOLS_VERSION" \
                "ndk;$AURAW_ANDROID_NDK_VERSION" \
                "cmake;$ANDROID_CMAKE_VERSION"; then
                return 0
              fi
              echo "sdkmanager failed on attempt $attempt; retrying..." >&2
              sleep $((attempt * 10))
            done
            return 1
          }

          ANDROID_HOME="$HOME/android-sdk"
          ANDROID_SDK_ROOT="$ANDROID_HOME"
          ANDROID_CMAKE_VERSION="3.22.1"
          export ANDROID_HOME ANDROID_SDK_ROOT ANDROID_CMAKE_VERSION

          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            rm -rf /tmp/android-command-line-tools
            mkdir -p "$ANDROID_HOME/cmdline-tools" /tmp/android-command-line-tools
            ANDROID_CMDLINE_TOOLS_SHA512=b65e830d7655fb39cc9eee669806977f462c49375807ef2c6487fabcc9afdbc210465ce6a1e2429ff95c74ca519d1239daf9a403c30b8d0bdb7a0962af656c8e
            bootstrap_download_verified \
              https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip \
              /tmp/android-command-line-tools.zip \
              "sha512:$ANDROID_CMDLINE_TOOLS_SHA512"
            unzip -q /tmp/android-command-line-tools.zip -d /tmp/android-command-line-tools
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv /tmp/android-command-line-tools/cmdline-tools \
              "$ANDROID_HOME/cmdline-tools/latest"
          fi

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          install_sdk_packages
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$AURAW_ANDROID_NDK_VERSION"
          export PATH="$ANDROID_HOME/cmake/$ANDROID_CMAKE_VERSION/bin:$PATH"

          LIBCLANG_SO="$(find /usr/lib -path '*/llvm-*/lib/libclang.so*' -print -quit 2>/dev/null || true)"
          if [ -n "$LIBCLANG_SO" ]; then
            export LIBCLANG_PATH="$(dirname "$LIBCLANG_SO")"
          fi

          # This is a host-side compile preflight, not the Android native build.
          # The runner intentionally does not install desktop LibRaw; the real
          # target build below stages and links the pinned Android LibRaw/Lensfun.
          AURAW_ALLOW_NO_LIBRAW=1 cargo check --locked --workspace
          ./gradlew --version

          ./gradlew \
            --no-daemon \
            --stacktrace \
            -p android \
            assembleDebug \
            -PaurawAbis=arm64-v8a \
            -PaurawVersionCode="$GITHUB_RUN_NUMBER"

          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          cargo xtask verify-android-16kb "$APK"
          mkdir -p dist
          cp "$APK" dist/AuRaw-debug-arm64-v8a.apk
          sha256sum dist/AuRaw-debug-arm64-v8a.apk \
            > dist/AuRaw-debug-arm64-v8a.apk.sha256

      - name: Upload debug APK
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: auraw-android-debug-arm64-v8a
          path: dist/*
          if-no-files-found: error
