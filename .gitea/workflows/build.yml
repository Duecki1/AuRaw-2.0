name: Build AuRaw

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  DEBIAN_FRONTEND: noninteractive

jobs:
  linux-appimage:
    name: Linux AppImage
    runs-on: ubuntu-latest
    env:
      LIBRAW_PREFIX: /tmp/auraw-libraw
      PKG_CONFIG_PATH: /tmp/auraw-libraw/lib/pkgconfig
      LD_LIBRARY_PATH: /tmp/auraw-libraw/lib

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Restore Linux build cache
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            /tmp/auraw-libraw
            /tmp/linuxdeploy-x86_64.AppImage
          key: auraw-linux-${{ runner.os }}-${{ runner.arch }}-rust-1.92.0-libraw-823f25d-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'build.rs') }}
          restore-keys: |
            auraw-linux-${{ runner.os }}-${{ runner.arch }}-rust-1.92.0-libraw-823f25d-

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          if [ "$(id -u)" -eq 0 ]; then
            SUDO=""
          else
            SUDO="sudo"
          fi

          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            build-essential \
            autoconf \
            automake \
            ca-certificates \
            clang \
            curl \
            file \
            libasound2-dev \
            libclang-dev \
            libdbus-1-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            libjpeg-dev \
            liblcms2-dev \
            libtool \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxkbcommon-dev \
            patchelf \
            pkg-config \
            python3 \
            squashfs-tools \
            wget \
            zlib1g-dev

      - name: Build release binary
        shell: bash
        run: |
          set -euxo pipefail

          download_verified() {
            scripts/verified-download.sh "$1" "$2" "$3"
          }

          download_verified \
            https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
            /tmp/rustup-init \
            https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init.sha256
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --profile minimal --default-toolchain 1.92.0
          source "$HOME/.cargo/env"

          # Match the LibRaw checkout and default Autotools configuration
          # installed in /usr/local on the development PC.
          LIBRAW_REVISION=b860248a89d9082b8e0a1e202e516f46af9adb29
          LIBRAW_ARCHIVE_SHA256=f5da1e522ea195b54b30f3ff105ef2193daa04ea165dea825b4d6fe9d886395b
          if [ -f "$LIBRAW_PREFIX/lib/pkgconfig/libraw.pc" ] \
            && [ -f "$LIBRAW_PREFIX/lib/libraw.so" ] \
            && [ "$(pkg-config --modversion libraw)" = "0.22.1" ]; then
            echo "Using cached desktop LibRaw $LIBRAW_REVISION"
          else
            rm -rf /tmp/auraw-libraw-src "$LIBRAW_PREFIX"
            mkdir -p /tmp/auraw-libraw-src
            download_verified \
              "https://github.com/LibRaw/LibRaw/archive/$LIBRAW_REVISION.tar.gz" \
              /tmp/auraw-libraw.tar.gz "$LIBRAW_ARCHIVE_SHA256"
            tar -xzf /tmp/auraw-libraw.tar.gz \
              --strip-components=1 \
              -C /tmp/auraw-libraw-src
            (
              cd /tmp/auraw-libraw-src
              autoreconf --install --force
              ./configure --prefix="$LIBRAW_PREFIX"
              make --jobs="$(nproc)"
              make install
            )
          fi

          LIBCLANG_SO="$(find /usr/lib -path '*/llvm-*/lib/libclang.so*' -print -quit 2>/dev/null || true)"
          if [ -n "$LIBCLANG_SO" ]; then
            export LIBCLANG_PATH="$(dirname "$LIBCLANG_SO")"
          fi

          test "$(pkg-config --modversion libraw)" = "0.22.1"
          REVISION="$(scripts/verify-source-revision.sh)"
          export AURAW_REQUIRE_COMMITTED_SOURCE=1
          export AURAW_SOURCE_REVISION="$REVISION"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$REVISION")"
          cargo build --release --locked
          strip target/release/auraw

          ldd target/release/auraw | tee /tmp/auraw-ldd.txt
          grep -Eq 'libraw(_r)?\.so' /tmp/auraw-ldd.txt

      - name: Package AppImage
        shell: bash
        run: |
          set -euxo pipefail

          download_verified() {
            scripts/verified-download.sh "$1" "$2" "$3"
          }

          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$VERSION"

          LIBRAW_SO="$(ldd target/release/auraw | awk '/libraw(_r)?\.so/{print $3; exit}')"
          test -f "$LIBRAW_SO"
          echo "Bundling LibRaw from $LIBRAW_SO"

          rm -rf AppDir dist packaging squashfs-root
          mkdir -p dist packaging

          cat > packaging/auraw.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=AuRaw
          Comment=GPU-first RAW image editor
          Exec=auraw
          Icon=auraw
          Categories=Graphics;Photography;
          Terminal=false
          DESKTOP

          python3 - <<'PY'
          import struct
          import zlib

          width = height = 256
          pixels = []
          for y in range(height):
              row = bytearray()
              for x in range(width):
                  r, g, b, a = 232, 126, 42, 255
                  if 52 <= x <= 204 and 44 <= y <= 212:
                      left = abs(x - 93) <= max(5, (y - 55) // 7)
                      right = abs(x - 163) <= max(5, (y - 55) // 7)
                      cross = 91 <= y <= 111 and 92 <= x <= 165
                      if left or right or cross:
                          r, g, b = 37, 42, 48
                  dx, dy = x - 128, y - 165
                  if 24 * 24 <= dx * dx + dy * dy <= 37 * 37:
                      r, g, b = 37, 42, 48
                  row.extend((r, g, b, a))
              pixels.append(b"\x00" + bytes(row))

          def chunk(kind, data):
              return (
                  struct.pack(">I", len(data))
                  + kind
                  + data
                  + struct.pack(">I", zlib.crc32(kind + data) & 0xFFFFFFFF)
              )

          png = b"\x89PNG\r\n\x1a\n"
          png += chunk(b"IHDR", struct.pack(">IIBBBBB", width, height, 8, 6, 0, 0, 0))
          png += chunk(b"IDAT", zlib.compress(b"".join(pixels), 9))
          png += chunk(b"IEND", b"")
          with open("packaging/auraw.png", "wb") as handle:
              handle.write(png)
          PY

          # Digest from the successful upstream release build artifact.
          LINUXDEPLOY_SHA256=df2e0f88e160e6886ba311f80be1fda21ff329caf7d45a609316c97cda3818c9
          download_verified \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage \
            /tmp/linuxdeploy-x86_64.AppImage "$LINUXDEPLOY_SHA256"
          chmod +x /tmp/linuxdeploy-x86_64.AppImage

          export APPIMAGE_EXTRACT_AND_RUN=1
          export LDAI_OUTPUT="AuRaw-${VERSION}-x86_64.AppImage"
          /tmp/linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable "$PWD/target/release/auraw" \
            --library "$LIBRAW_SO" \
            --desktop-file "$PWD/packaging/auraw.desktop" \
            --icon-file "$PWD/packaging/auraw.png" \
            --output appimage

          test -n "$(find AppDir -name 'libraw*.so*' -print -quit)"

          mv "$LDAI_OUTPUT" dist/
          chmod +x "dist/$LDAI_OUTPUT"
          file "dist/$LDAI_OUTPUT"

          unset APPIMAGE_EXTRACT_AND_RUN
          "dist/$LDAI_OUTPUT" --appimage-extract >/dev/null
          test -n "$(find squashfs-root -name 'libraw*.so*' -print -quit)"
          rm -rf squashfs-root

          sha256sum "dist/$LDAI_OUTPUT" > "dist/$LDAI_OUTPUT.sha256"

      - name: Upload AppImage
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: auraw-linux-appimage
          path: dist/*
          if-no-files-found: error

  android-debug-apk:
    name: Android debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Restore pinned Android toolchains
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: |
            ~/android-sdk
            ~/gradle-8.11.1
            ~/.cargo/bin/cargo-ndk
            ~/.cargo/bin/cargo-ndk-env
            ~/.cargo/bin/cargo-ndk-runner
            ~/.cargo/bin/cargo-ndk-test
            android/native
          key: auraw-android-tools-${{ runner.os }}-${{ runner.arch }}-arm64-ndk-27.0.12077973-cmake-3.22.1-gradle-8.11.1-cargo-ndk-4.1.2-libraw-0.22.1-v1

      - name: Restore Android dependency and build cache
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ~/.gradle/caches
            ~/.gradle/notifications
            android/.gradle
          key: auraw-android-build-${{ runner.os }}-${{ runner.arch }}-arm64-rust-1.92.0-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'build.rs', 'android/build.gradle', 'android/app/build.gradle') }}
          restore-keys: |
            auraw-android-build-${{ runner.os }}-${{ runner.arch }}-arm64-rust-1.92.0-

      - name: Set up Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android and native build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          if [ "$(id -u)" -eq 0 ]; then
            SUDO=""
          else
            SUDO="sudo"
          fi

          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            clang \
            curl \
            libclang-dev \
            pkg-config \
            tar \
            unzip \
            zip

      - name: Build arm64 debug APK
        shell: bash
        run: |
          set -euxo pipefail

          download_verified() {
            scripts/verified-download.sh "$1" "$2" "$3"
          }

          install_sdk_packages() {
            local attempt
            for attempt in 1 2 3 4; do
              if sdkmanager \
                "platform-tools" \
                "platforms;android-35" \
                "build-tools;35.0.0" \
                "ndk;$ANDROID_NDK_VERSION" \
                "cmake;$ANDROID_CMAKE_VERSION"; then
                return 0
              fi
              echo "sdkmanager failed on attempt $attempt; retrying..." >&2
              sleep $((attempt * 10))
            done
            return 1
          }

          ANDROID_HOME="$HOME/android-sdk"
          ANDROID_SDK_ROOT="$ANDROID_HOME"
          ANDROID_NDK_VERSION="27.0.12077973"
          ANDROID_CMAKE_VERSION="3.22.1"
          GRADLE_VERSION="8.11.1"
          export ANDROID_HOME ANDROID_SDK_ROOT ANDROID_NDK_VERSION ANDROID_CMAKE_VERSION

          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            rm -rf /tmp/android-command-line-tools
            mkdir -p "$ANDROID_HOME/cmdline-tools" /tmp/android-command-line-tools
            # Raw archive SHA-512 from the Gentoo Manifest for this exact Google artifact.
            ANDROID_CMDLINE_TOOLS_SHA512=b65e830d7655fb39cc9eee669806977f462c49375807ef2c6487fabcc9afdbc210465ce6a1e2429ff95c74ca519d1239daf9a403c30b8d0bdb7a0962af656c8e
            download_verified \
              https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip \
              /tmp/android-command-line-tools.zip \
              "sha512:$ANDROID_CMDLINE_TOOLS_SHA512"
            unzip -q /tmp/android-command-line-tools.zip -d /tmp/android-command-line-tools
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv /tmp/android-command-line-tools/cmdline-tools \
              "$ANDROID_HOME/cmdline-tools/latest"
          fi

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          install_sdk_packages
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          export PATH="$ANDROID_HOME/cmake/$ANDROID_CMAKE_VERSION/bin:$PATH"

          download_verified \
            https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
            /tmp/rustup-init \
            https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init.sha256
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --profile minimal --default-toolchain 1.92.0
          source "$HOME/.cargo/env"
          rustup target add aarch64-linux-android
          if [ "$(cargo ndk --version 2>/dev/null || true)" != "cargo-ndk 4.1.2" ]; then
            cargo install cargo-ndk --version 4.1.2 --locked
          fi

          LIBCLANG_SO="$(find /usr/lib -path '*/llvm-*/lib/libclang.so*' -print -quit 2>/dev/null || true)"
          if [ -n "$LIBCLANG_SO" ]; then
            export LIBCLANG_PATH="$(dirname "$LIBCLANG_SO")"
          fi

          if [ ! -x "$HOME/gradle-${GRADLE_VERSION}/bin/gradle" ]; then
            download_verified \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              /tmp/gradle.zip \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip.sha256"
            rm -rf "$HOME/gradle-${GRADLE_VERSION}"
            unzip -q /tmp/gradle.zip -d "$HOME"
          fi
          export PATH="$HOME/gradle-${GRADLE_VERSION}/bin:$PATH"

          gradle --version
          gradle \
            --no-daemon \
            --stacktrace \
            -p android \
            assembleDebug \
            -PaurawAbi=arm64-v8a

          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -tq "$APK" 'lib/arm64-v8a/libauraw.so'
          unzip -tq "$APK" 'lib/arm64-v8a/libc++_shared.so'
          mkdir -p dist
          cp "$APK" dist/AuRaw-debug-arm64-v8a.apk
          sha256sum dist/AuRaw-debug-arm64-v8a.apk \
            > dist/AuRaw-debug-arm64-v8a.apk.sha256

      - name: Upload debug APK
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: auraw-android-debug-arm64-v8a
          path: dist/*
          if-no-files-found: error
