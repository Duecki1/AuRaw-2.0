name: Build AuRaw

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  DEBIAN_FRONTEND: noninteractive

jobs:
  linux-appimage:
    name: Linux AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          if [ "$(id -u)" -eq 0 ]; then
            SUDO=""
          else
            SUDO="sudo"
          fi

          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            clang \
            curl \
            file \
            libasound2-dev \
            libclang-dev \
            libdbus-1-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            libraw-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxkbcommon-dev \
            patchelf \
            pkg-config \
            python3 \
            squashfs-tools \
            wget

      - name: Build release binary
        shell: bash
        run: |
          set -euxo pipefail

          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          source "$HOME/.cargo/env"

          LIBCLANG_SO="$(find /usr/lib -path '*/llvm-*/lib/libclang.so*' -print -quit 2>/dev/null || true)"
          if [ -n "$LIBCLANG_SO" ]; then
            export LIBCLANG_PATH="$(dirname "$LIBCLANG_SO")"
          fi

          cargo build --release --locked
          strip target/release/auraw

      - name: Package AppImage
        shell: bash
        run: |
          set -euxo pipefail

          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$VERSION"

          rm -rf AppDir dist packaging
          mkdir -p dist packaging

          cat > packaging/auraw.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=AuRaw
          Comment=GPU-first RAW image editor
          Exec=auraw
          Icon=auraw
          Categories=Graphics;Photography;
          Terminal=false
          EOF

          # Generate a dependency-free 256x256 PNG icon for AppImage metadata.
          python3 - <<'PY'
          import struct
          import zlib

          width = height = 256
          pixels = []
          for y in range(height):
              row = bytearray()
              for x in range(width):
                  # Warm background with a simple dark aperture/A mark.
                  r, g, b, a = 232, 126, 42, 255
                  if 52 <= x <= 204 and 44 <= y <= 212:
                      left = abs(x - 93) <= max(5, (y - 55) // 7)
                      right = abs(x - 163) <= max(5, (y - 55) // 7)
                      cross = 91 <= y <= 111 and 92 <= x <= 165
                      if left or right or cross:
                          r, g, b = 37, 42, 48
                  dx, dy = x - 128, y - 165
                  if 24 * 24 <= dx * dx + dy * dy <= 37 * 37:
                      r, g, b = 37, 42, 48
                  row.extend((r, g, b, a))
              pixels.append(b"\x00" + bytes(row))

          def chunk(kind, data):
              return (
                  struct.pack(">I", len(data))
                  + kind
                  + data
                  + struct.pack(">I", zlib.crc32(kind + data) & 0xFFFFFFFF)
              )

          png = b"\x89PNG\r\n\x1a\n"
          png += chunk(b"IHDR", struct.pack(">IIBBBBB", width, height, 8, 6, 0, 0, 0))
          png += chunk(b"IDAT", zlib.compress(b"".join(pixels), 9))
          png += chunk(b"IEND", b"")
          with open("packaging/auraw.png", "wb") as handle:
              handle.write(png)
          PY

          curl -fL \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage \
            -o linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

          export APPIMAGE_EXTRACT_AND_RUN=1
          export LDAI_OUTPUT="AuRaw-${VERSION}-x86_64.AppImage"
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable "$PWD/target/release/auraw" \
            --desktop-file "$PWD/packaging/auraw.desktop" \
            --icon-file "$PWD/packaging/auraw.png" \
            --output appimage

          mv "$LDAI_OUTPUT" dist/
          chmod +x "dist/$LDAI_OUTPUT"
          file "dist/$LDAI_OUTPUT"
          unset APPIMAGE_EXTRACT_AND_RUN
          "dist/$LDAI_OUTPUT" --appimage-extract >/dev/null
          rm -rf squashfs-root
          sha256sum "dist/$LDAI_OUTPUT" > "dist/$LDAI_OUTPUT.sha256"

      - name: Upload AppImage
        uses: actions/upload-artifact@v3
        with:
          name: auraw-linux-appimage
          path: dist/*
          if-no-files-found: error

  android-debug-apk:
    name: Android debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android and native build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          if [ "$(id -u)" -eq 0 ]; then
            SUDO=""
          else
            SUDO="sudo"
          fi

          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            clang \
            cmake \
            curl \
            libclang-dev \
            ninja-build \
            pkg-config \
            tar \
            unzip \
            zip

      - name: Build arm64 debug APK
        shell: bash
        run: |
          set -euxo pipefail

          ANDROID_SDK_ROOT="$HOME/android-sdk"
          ANDROID_NDK_VERSION="28.0.13004108"
          GRADLE_VERSION="8.11.1"
          export ANDROID_SDK_ROOT ANDROID_HOME="$ANDROID_SDK_ROOT"

          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fL \
            https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip \
            -o /tmp/android-command-line-tools.zip
          unzip -q /tmp/android-command-line-tools.zip -d /tmp/android-command-line-tools
          mv /tmp/android-command-line-tools/cmdline-tools \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;$ANDROID_NDK_VERSION"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION"

          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          source "$HOME/.cargo/env"
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked

          LIBCLANG_SO="$(find /usr/lib -path '*/llvm-*/lib/libclang.so*' -print -quit 2>/dev/null || true)"
          if [ -n "$LIBCLANG_SO" ]; then
            export LIBCLANG_PATH="$(dirname "$LIBCLANG_SO")"
          fi

          curl -fL \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
          export PATH="$HOME/gradle-${GRADLE_VERSION}/bin:$PATH"

          gradle --version
          gradle \
            --no-daemon \
            --stacktrace \
            -p android \
            assembleDebug \
            -PaurawAbi=arm64-v8a

          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          mkdir -p dist
          cp "$APK" dist/AuRaw-debug-arm64-v8a.apk
          sha256sum dist/AuRaw-debug-arm64-v8a.apk \
            > dist/AuRaw-debug-arm64-v8a.apk.sha256

      - name: Upload debug APK
        uses: actions/upload-artifact@v3
        with:
          name: auraw-android-debug-apk
          path: dist/*
          if-no-files-found: error
