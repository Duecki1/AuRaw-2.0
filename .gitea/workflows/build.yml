name: Build AuRaw

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  DEBIAN_FRONTEND: noninteractive

jobs:
  linux-appimage:
    name: Linux AppImage
    runs-on: ubuntu-latest
    env:
      LIBRAW_PREFIX: /tmp/auraw-libraw
      PKG_CONFIG_PATH: /tmp/auraw-libraw/lib/pkgconfig
      LD_LIBRARY_PATH: /tmp/auraw-libraw/lib

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Restore Linux build cache
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            /tmp/auraw-libraw
            /tmp/linuxdeploy-x86_64.AppImage
          key: auraw-linux-${{ runner.os }}-${{ runner.arch }}-rust-1.92.0-libraw-823f25d-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'build.rs') }}
          restore-keys: |
            auraw-linux-${{ runner.os }}-${{ runner.arch }}-rust-1.92.0-libraw-823f25d-

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          if [ "$(id -u)" -eq 0 ]; then
            SUDO=""
          else
            SUDO="sudo"
          fi

          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            build-essential \
            autoconf \
            automake \
            ca-certificates \
            clang \
            curl \
            file \
            libasound2-dev \
            libclang-dev \
            libdbus-1-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            libjpeg-dev \
            liblcms2-dev \
            liblensfun-dev \
            liblensfun-data-v1 \
            libtool \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxkbcommon-dev \
            patchelf \
            pkg-config \
            python3 \
            squashfs-tools \
            wget \
            zlib1g-dev

      - name: Build release binary
        shell: bash
        run: |
          set -euxo pipefail

          download_verified() {
            python3 scripts/dev.py verified-download "$1" "$2" "$3"
          }

          download_verified \
            https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
            /tmp/rustup-init \
            https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init.sha256
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --profile minimal --default-toolchain 1.92.0
          source "$HOME/.cargo/env"

          # Match the LibRaw checkout and default Autotools configuration
          # installed in /usr/local on the development PC.
          eval "$(python3 scripts/dev.py print-build-metadata --format shell)"
          LIBRAW_SOURCE_REVISION=b860248a89d9082b8e0a1e202e516f46af9adb29
          LIBRAW_ARCHIVE_SHA256=f5da1e522ea195b54b30f3ff105ef2193daa04ea165dea825b4d6fe9d886395b
          if [ -f "$LIBRAW_PREFIX/lib/pkgconfig/libraw.pc" ] \
            && [ -f "$LIBRAW_PREFIX/lib/libraw.so" ] \
            && [ "$(pkg-config --modversion libraw)" = "$AURAW_LIBRAW_REVISION" ]; then
            echo "Using cached desktop LibRaw $LIBRAW_SOURCE_REVISION"
          else
            rm -rf /tmp/auraw-libraw-src "$LIBRAW_PREFIX"
            mkdir -p /tmp/auraw-libraw-src
            download_verified \
              "https://github.com/LibRaw/LibRaw/archive/$LIBRAW_SOURCE_REVISION.tar.gz" \
              /tmp/auraw-libraw.tar.gz "$LIBRAW_ARCHIVE_SHA256"
            tar -xzf /tmp/auraw-libraw.tar.gz \
              --strip-components=1 \
              -C /tmp/auraw-libraw-src
            (
              cd /tmp/auraw-libraw-src
              autoreconf --install --force
              ./configure --prefix="$LIBRAW_PREFIX"
              make --jobs="$(nproc)"
              make install
            )
          fi

          LIBCLANG_SO="$(find /usr/lib -path '*/llvm-*/lib/libclang.so*' -print -quit 2>/dev/null || true)"
          if [ -n "$LIBCLANG_SO" ]; then
            export LIBCLANG_PATH="$(dirname "$LIBCLANG_SO")"
          fi

          test "$(pkg-config --modversion libraw)" = "$AURAW_LIBRAW_REVISION"
          pkg-config --modversion lensfun
          REVISION="$(python3 scripts/dev.py verify-source-revision)"
          export AURAW_REQUIRE_COMMITTED_SOURCE=1
          export AURAW_SOURCE_REVISION="$REVISION"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$REVISION")"
          cargo build --release --locked
          strip target/release/auraw

          ldd target/release/auraw | tee /tmp/auraw-ldd.txt
          grep -Eq 'libraw(_r)?\.so' /tmp/auraw-ldd.txt
          grep -Eq 'liblensfun\.so' /tmp/auraw-ldd.txt

      - name: Package AppImage
        shell: bash
        run: |
          set -euxo pipefail

          download_verified() {
            python3 scripts/dev.py verified-download "$1" "$2" "$3"
          }

          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$VERSION"

          LIBRAW_SO="$(ldd target/release/auraw | awk '/libraw(_r)?\.so/{print $3; exit}')"
          LENSFUN_SO="$(ldd target/release/auraw | awk '/liblensfun\.so/{print $3; exit}')"
          test -f "$LIBRAW_SO"
          test -f "$LENSFUN_SO"
          echo "Bundling LibRaw from $LIBRAW_SO"
          echo "Bundling Lensfun from $LENSFUN_SO"

          LENSFUN_DB="$(find /usr/share/lensfun -type f -name '*.xml' -printf '%h\n' | head -n 1)"
          test -n "$LENSFUN_DB"

          rm -rf AppDir dist appimage-packaging squashfs-root
          mkdir -p dist appimage-packaging AppDir/usr/share/auraw/lensfun
          cp -a "$LENSFUN_DB"/. AppDir/usr/share/auraw/lensfun/
          test -n "$(find AppDir/usr/share/auraw/lensfun -name '*.xml' -print -quit)"

          APP_ID=de.duecki.auraw
          DESKTOP_FILE="$PWD/packaging/linux/$APP_ID.desktop"
          APPIMAGE_ICON="$PWD/appimage-packaging/$APP_ID.png"
          test -s "$DESKTOP_FILE"
          grep -qx "Icon=$APP_ID" "$DESKTOP_FILE"
          grep -qx "StartupWMClass=$APP_ID" "$DESKTOP_FILE"

          # Keep Linux packaging on the same checked-in artwork used by the
          # Android launcher, Windows executable, macOS bundle, and app window.
          install -m 0644 packaging/icons/auraw-256.png "$APPIMAGE_ICON"
          install -m 0644 "$DESKTOP_FILE" "AppDir/$APP_ID.desktop"
          install -Dm 0644 "$DESKTOP_FILE" \
            "AppDir/usr/share/applications/$APP_ID.desktop"
          install -m 0644 "$APPIMAGE_ICON" "AppDir/$APP_ID.png"
          install -Dm 0644 "$APPIMAGE_ICON" \
            "AppDir/usr/share/icons/hicolor/256x256/apps/$APP_ID.png"
          ln -s "$APP_ID.png" AppDir/.DirIcon
          test -s "$APPIMAGE_ICON"
          test -L AppDir/.DirIcon

          # Digest from the successful upstream release build artifact.
          LINUXDEPLOY_SHA256=c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d
          download_verified \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage \
            /tmp/linuxdeploy-x86_64.AppImage "$LINUXDEPLOY_SHA256"
          chmod +x /tmp/linuxdeploy-x86_64.AppImage

          export APPIMAGE_EXTRACT_AND_RUN=1
          export LDAI_OUTPUT="AuRaw-${VERSION}-x86_64.AppImage"
          /tmp/linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable "$PWD/target/release/auraw" \
            --library "$LIBRAW_SO" \
            --library "$LENSFUN_SO" \
            --desktop-file "$DESKTOP_FILE" \
            --icon-file "$APPIMAGE_ICON" \
            --output appimage

          test -n "$(find AppDir -name 'libraw*.so*' -print -quit)"
          test -n "$(find AppDir -name 'liblensfun*.so*' -print -quit)"
          test -n "$(find AppDir/usr/share/auraw/lensfun -name '*.xml' -print -quit)"

          mv "$LDAI_OUTPUT" dist/
          chmod +x "dist/$LDAI_OUTPUT"
          file "dist/$LDAI_OUTPUT"

          unset APPIMAGE_EXTRACT_AND_RUN
          "dist/$LDAI_OUTPUT" --appimage-extract >/dev/null
          test -n "$(find squashfs-root -name 'libraw*.so*' -print -quit)"
          test -n "$(find squashfs-root -name 'liblensfun*.so*' -print -quit)"
          test -n "$(find squashfs-root/usr/share/auraw/lensfun -name '*.xml' -print -quit)"
          test -L squashfs-root/.DirIcon
          test "$(readlink squashfs-root/.DirIcon)" = "$APP_ID.png"
          cmp packaging/icons/auraw-256.png "squashfs-root/$APP_ID.png"
          cmp packaging/icons/auraw-256.png \
            "squashfs-root/usr/share/icons/hicolor/256x256/apps/$APP_ID.png"
          test -f "squashfs-root/usr/share/applications/$APP_ID.desktop"
          grep -qx "Icon=$APP_ID" \
            "squashfs-root/usr/share/applications/$APP_ID.desktop"
          grep -qx "StartupWMClass=$APP_ID" \
            "squashfs-root/usr/share/applications/$APP_ID.desktop"
          rm -rf squashfs-root

          sha256sum "dist/$LDAI_OUTPUT" > "dist/$LDAI_OUTPUT.sha256"

      - name: Upload AppImage
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: auraw-linux-appimage
          path: dist/*
          if-no-files-found: error

  android-debug-apk:
    name: Android debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Keep the same debug certificate for installable builds. Android rejects
      # an APK update when its signing certificate differs from the installed
      # package. Do not expose this cache to pull-request code.
      - name: Restore Android debug signing key
        if: ${{ gitea.event_name != 'pull_request' }}
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: ~/.android/debug.keystore
          key: auraw-android-debug-keystore-v1

      - name: Restore pinned Android toolchains
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: |
            ~/android-sdk
            ~/.gradle/wrapper
            ~/.cargo/bin/cargo-ndk
            ~/.cargo/bin/cargo-ndk-env
            ~/.cargo/bin/cargo-ndk-runner
            ~/.cargo/bin/cargo-ndk-test
            android/native
          key: auraw-android-tools-${{ runner.os }}-${{ runner.arch }}-arm64-${{ hashFiles('Cargo.toml', 'rust-toolchain.toml', 'gradle/wrapper/gradle-wrapper.properties', 'scripts/dev.py') }}-v2

      - name: Restore Android dependency and build cache
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ~/.gradle/caches
            ~/.gradle/notifications
            android/.gradle
          key: auraw-android-build-${{ runner.os }}-${{ runner.arch }}-arm64-rust-1.92.0-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'build.rs', 'android/build.gradle', 'android/app/build.gradle') }}
          restore-keys: |
            auraw-android-build-${{ runner.os }}-${{ runner.arch }}-arm64-rust-1.92.0-

      - name: Set up Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Initialize Android debug signing key
        shell: bash
        run: |
          set -euxo pipefail

          KEYSTORE="$HOME/.android/debug.keystore"
          mkdir -p "$(dirname "$KEYSTORE")"
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -noprompt
          fi
          chmod 600 "$KEYSTORE"

          # Print only the public certificate fingerprint for troubleshooting.
          keytool -list -v \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey \
            | grep -E 'Alias name:|SHA256:'

      - name: Install Android and native build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          if [ "$(id -u)" -eq 0 ]; then
            SUDO=""
          else
            SUDO="sudo"
          fi

          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            clang \
            curl \
            libclang-dev \
            pkg-config \
            tar \
            unzip \
            zip

      - name: Build arm64 debug APK
        shell: bash
        run: |
          set -euxo pipefail

          download_verified() {
            python3 scripts/dev.py verified-download "$1" "$2" "$3"
          }

          eval "$(python3 scripts/dev.py print-build-metadata --format shell)"

          install_sdk_packages() {
            local attempt
            for attempt in 1 2 3 4; do
              if sdkmanager \
                "platform-tools" \
                "platforms;android-$AURAW_ANDROID_COMPILE_SDK" \
                "build-tools;$AURAW_ANDROID_BUILD_TOOLS_VERSION" \
                "ndk;$AURAW_ANDROID_NDK_VERSION" \
                "cmake;$ANDROID_CMAKE_VERSION"; then
                return 0
              fi
              echo "sdkmanager failed on attempt $attempt; retrying..." >&2
              sleep $((attempt * 10))
            done
            return 1
          }

          ANDROID_HOME="$HOME/android-sdk"
          ANDROID_SDK_ROOT="$ANDROID_HOME"
          ANDROID_CMAKE_VERSION="3.22.1"
          export ANDROID_HOME ANDROID_SDK_ROOT ANDROID_CMAKE_VERSION

          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            rm -rf /tmp/android-command-line-tools
            mkdir -p "$ANDROID_HOME/cmdline-tools" /tmp/android-command-line-tools
            # Raw archive SHA-512 from the Gentoo Manifest for this exact Google artifact.
            ANDROID_CMDLINE_TOOLS_SHA512=b65e830d7655fb39cc9eee669806977f462c49375807ef2c6487fabcc9afdbc210465ce6a1e2429ff95c74ca519d1239daf9a403c30b8d0bdb7a0962af656c8e
            download_verified \
              https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip \
              /tmp/android-command-line-tools.zip \
              "sha512:$ANDROID_CMDLINE_TOOLS_SHA512"
            unzip -q /tmp/android-command-line-tools.zip -d /tmp/android-command-line-tools
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv /tmp/android-command-line-tools/cmdline-tools \
              "$ANDROID_HOME/cmdline-tools/latest"
          fi

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          install_sdk_packages
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$AURAW_ANDROID_NDK_VERSION"
          export PATH="$ANDROID_HOME/cmake/$ANDROID_CMAKE_VERSION/bin:$PATH"

          download_verified \
            https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
            /tmp/rustup-init \
            https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init.sha256
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --profile minimal --default-toolchain 1.92.0
          source "$HOME/.cargo/env"
          rustup target add aarch64-linux-android
          if [ "$(cargo ndk --version 2>/dev/null || true)" != "cargo-ndk 4.1.2" ]; then
            cargo install cargo-ndk --version 4.1.2 --locked
          fi

          LIBCLANG_SO="$(find /usr/lib -path '*/llvm-*/lib/libclang.so*' -print -quit 2>/dev/null || true)"
          if [ -n "$LIBCLANG_SO" ]; then
            export LIBCLANG_PATH="$(dirname "$LIBCLANG_SO")"
          fi

          python3 scripts/dev.py check-gradle
          ./gradlew --version
          case "$GITHUB_RUN_NUMBER" in
            ''|*[!0-9]*)
              echo "GITHUB_RUN_NUMBER must be a positive integer" >&2
              exit 1
              ;;
          esac

          ./gradlew \
            --no-daemon \
            --stacktrace \
            -p android \
            assembleDebug \
            -PaurawAbi=arm64-v8a \
            -PaurawVersionCode="$GITHUB_RUN_NUMBER"

          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -tq "$APK" 'lib/arm64-v8a/libauraw.so'
          unzip -tq "$APK" 'lib/arm64-v8a/libc++_shared.so'
          unzip -tq "$APK" 'assets/lensfun/version_1/*.xml'
          "$ANDROID_HOME/build-tools/$AURAW_ANDROID_BUILD_TOOLS_VERSION/aapt" dump badging "$APK" \
            | tee /tmp/auraw-apk-badging.txt
          grep -q "application-icon-" /tmp/auraw-apk-badging.txt
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' \
            android/app/src/main/AndroidManifest.xml
          python3 scripts/dev.py verify-android-16kb "$APK"
          mkdir -p dist
          cp "$APK" dist/AuRaw-debug-arm64-v8a.apk
          "$ANDROID_HOME/build-tools/$AURAW_ANDROID_BUILD_TOOLS_VERSION/apksigner" \
            verify --print-certs "$APK" \
            | tee dist/AuRaw-debug-arm64-v8a.signing-certificate.txt
          sha256sum dist/AuRaw-debug-arm64-v8a.apk \
            > dist/AuRaw-debug-arm64-v8a.apk.sha256

      - name: Upload debug APK
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: auraw-android-debug-arm64-v8a
          path: dist/*
          if-no-files-found: error
