plugins {
    id "com.android.application" version "8.9.2" apply false
}


def requiredGradleVersion = org.gradle.util.GradleVersion.version("8.11.1")
if (org.gradle.util.GradleVersion.current() != requiredGradleVersion) {
    throw new org.gradle.api.GradleException(
        "AuRaw requires Gradle 8.11.1; found ${org.gradle.util.GradleVersion.current()}"
    )
}
