plugins {
    id "com.android.application"
}

android {
    namespace "de.duecki.auraw"
    compileSdk 35
    buildToolsVersion "35.0.0"
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId "de.duecki.auraw"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
        ndk {
            abiFilters((providers.gradleProperty("aurawAbi").getOrElse("arm64-v8a")))
        }
    }

    sourceSets {
        main.jniLibs.srcDirs = ["src/main/jniLibs"]
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def rustAbi = providers.gradleProperty("aurawAbi").getOrElse("arm64-v8a")
def repositoryRoot = rootProject.projectDir.parentFile
def buildRustEnabled = providers.gradleProperty("aurawBuildRust").map { it.toBoolean() }.getOrElse(true)

tasks.register("buildRust", Exec) {
    workingDir repositoryRoot
    commandLine "sh", new File(repositoryRoot, "scripts/build-android.sh"), rustAbi, "release"
}

if (buildRustEnabled) {
    tasks.named("preBuild").configure {
        dependsOn("buildRust")
    }
}
