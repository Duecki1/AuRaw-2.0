plugins {
    id "com.android.application"
}

def buildContract = new Properties()
new File(rootProject.projectDir, "build-contract.properties").withInputStream {
    buildContract.load(it)
}
def aurawNdkVersion = buildContract.getProperty("ndkVersion")
def aurawUseLegacyPackaging = buildContract.getProperty("useLegacyPackaging").toBoolean()

def aurawVersionCode = providers.gradleProperty("aurawVersionCode")
    .getOrElse("1")
    .toInteger()
def rustAbi = providers.gradleProperty("aurawAbi").getOrElse("arm64-v8a")
def repositoryRoot = rootProject.projectDir.parentFile
def lensfunAssets = new File(
    repositoryRoot,
    "android/native/lensfun/${rustAbi}/apk-assets"
)

android {
    namespace "de.duecki.auraw"
    compileSdk 36
    ndkVersion aurawNdkVersion

    defaultConfig {
        applicationId "de.duecki.auraw"
        minSdk 26
        targetSdk 36
        versionCode aurawVersionCode
        versionName "0.1.0"
        ndk {
            abiFilters((providers.gradleProperty("aurawAbi").getOrElse("arm64-v8a")))
        }
    }

    sourceSets {
        main.jniLibs.srcDirs = ["src/main/jniLibs"]
        main.assets.srcDirs = [lensfunAssets]
    }

    // AGP 8.5.1+ page-aligns uncompressed JNI libraries for 16 KiB-page devices.
    // Keep this explicit so a future packaging-default change cannot regress support.
    packagingOptions {
        jniLibs {
            useLegacyPackaging aurawUseLegacyPackaging
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ["-Xlint:deprecation"]
}

def buildRustEnabled = providers.gradleProperty("aurawBuildRust").map { it.toBoolean() }.getOrElse(true)

tasks.register("buildRustDebug", Exec) {
    workingDir repositoryRoot
    commandLine "python3", new File(repositoryRoot, "scripts/dev.py"), "build-android", rustAbi, "debug"
}

tasks.register("buildRustRelease", Exec) {
    workingDir repositoryRoot
    commandLine "python3", new File(repositoryRoot, "scripts/dev.py"), "build-android", rustAbi, "release"
}

if (buildRustEnabled) {
    tasks.matching { it.name == "preDebugBuild" }.configureEach {
        dependsOn("buildRustDebug")
    }
    tasks.matching { it.name == "preReleaseBuild" }.configureEach {
        dependsOn("buildRustRelease")
    }
}


tasks.register("printAndroidBuildContract") {
    doLast {
        println groovy.json.JsonOutput.toJson([
            ndkVersion: aurawNdkVersion,
            useLegacyPackaging: aurawUseLegacyPackaging,
        ])
    }
}
