import groovy.json.JsonSlurper

plugins {
    id "com.android.application"
}

def repositoryRoot = rootProject.projectDir.parentFile
def cargoManifest = new File(repositoryRoot, "Cargo.toml")

def loadCargoMetadata = {
    if (!cargoManifest.isFile()) {
        throw new GradleException("Cargo workspace manifest not found: ${cargoManifest}")
    }

    def metadataCommand = providers.exec {
        workingDir(repositoryRoot)
        commandLine("cargo", "metadata", "--locked", "--no-deps", "--format-version", "1")
        ignoreExitValue = true
    }
    def executionResult
    try {
        executionResult = metadataCommand.result.get()
    } catch (Exception error) {
        throw new GradleException("Unable to run `cargo metadata` while configuring Android.", error)
    }
    def stderr = metadataCommand.standardError.asText.get().trim()
    if (executionResult.exitValue != 0) {
        throw new GradleException("`cargo metadata` failed: ${stderr}")
    }

    def document = new JsonSlurper().parseText(metadataCommand.standardOutput.asText.get())
    if (!(document?.metadata instanceof Map)) {
        throw new GradleException("Cargo metadata did not contain workspace metadata.")
    }
    return document
}

def cargoMetadata = loadCargoMetadata()
def workspaceMetadata = cargoMetadata.metadata
def calibrawUiPackage = cargoMetadata.packages.find { it.name == "calibraw-ui" }
if (calibrawUiPackage == null || !(calibrawUiPackage.version instanceof String)) {
    throw new GradleException("Cargo metadata did not contain the calibraw-ui package version.")
}
def calibrawVersionName = calibrawUiPackage.version
def requireMetadata = { String key, Class expectedType ->
    if (!workspaceMetadata.containsKey(key)) {
        throw new GradleException(
            "${cargoManifest}: [workspace.metadata] is missing required key '${key}'"
        )
    }
    def value = workspaceMetadata[key]
    if (!expectedType.isInstance(value)) {
        throw new GradleException(
            "${cargoManifest}: [workspace.metadata].${key} must be ${expectedType.simpleName}"
        )
    }
    return value
}

def calibrawNdkVersion = requireMetadata("android_ndk_version", String)
def calibrawBuildToolsVersion = requireMetadata("android_build_tools_version", String)
def calibrawCompileSdk = requireMetadata("android_compile_sdk", Integer)
def calibrawMinSdk = requireMetadata("android_min_sdk", Integer)
def calibrawTargetSdk = requireMetadata("android_target_sdk", Integer)
def calibrawLibrawRevision = requireMetadata("libraw_revision", String)
def calibrawLensfunRevision = requireMetadata("lensfun_revision", String)
def calibrawUseLegacyPackaging = requireMetadata("android_use_legacy_packaging", Boolean)

def calibrawVersionCode = providers.gradleProperty("calibrawVersionCode")
    .getOrElse("1")
    .toInteger()

def requestedAbis = providers.gradleProperty("calibrawAbis")
    .orElse(providers.gradleProperty("calibrawAbi"))
    .getOrElse("arm64-v8a")
def calibrawAbis = requestedAbis
    .split(",")
    .collect { it.trim() }
    .findAll { !it.isEmpty() }
    .unique()
def supportedAbis = ["arm64-v8a"] as Set
if (calibrawAbis.isEmpty() || !supportedAbis.containsAll(calibrawAbis)) {
    throw new GradleException(
        "calibrawAbis must be arm64-v8a; found '${requestedAbis}'"
    )
}

def nativeStageRoot = new File(repositoryRoot, "android/native")
def stagedLegalAssets = layout.buildDirectory.dir("generated/calibraw-legal-assets/main")
def stageLegalAssets = tasks.register("stageLegalAssets", Sync) {
    from(repositoryRoot) {
        include("COPYING", "NOTICE.md", "THIRD_PARTY_NOTICES.md", "THIRD_PARTY_LICENSES.md")
    }
    into(stagedLegalAssets.get().asFile)
}
// Lensfun's XML database is architecture-independent. All ABI builds install
// the same pinned database, so package the copy staged by the first requested ABI.
def lensfunAssets = new File(
    nativeStageRoot,
    "lensfun/${calibrawAbis.first()}/apk-assets"
)

android {
    namespace "de.duecki.calibraw"
    compileSdk calibrawCompileSdk
    buildToolsVersion calibrawBuildToolsVersion
    ndkVersion calibrawNdkVersion

    defaultConfig {
        applicationId "de.duecki.calibraw"
        minSdk calibrawMinSdk
        targetSdk calibrawTargetSdk
        versionCode calibrawVersionCode
        versionName calibrawVersionName
        ndk {
            abiFilters(*calibrawAbis)
        }
        externalNativeBuild {
            cmake {
                targets "calibraw_native_deps"
                arguments(
                    "-DCALIBRAW_NATIVE_STAGE_ROOT=${nativeStageRoot.absolutePath}",
                    "-DCALIBRAW_ANDROID_MIN_SDK=${calibrawMinSdk}",
                    "-DCALIBRAW_LIBRAW_VERSION=${calibrawLibrawRevision}",
                    "-DCALIBRAW_LENSFUN_VERSION=${calibrawLensfunRevision}",
                    "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
                )
            }
        }
    }

    sourceSets {
        main.jniLibs.srcDirs = ["src/main/jniLibs"]
        main.assets.srcDirs = [lensfunAssets]
    }

    // AGP 8.5.1+ page-aligns uncompressed JNI libraries for 16 KiB-page devices.
    // Keep this explicit so a future packaging-default change cannot regress support.
    packagingOptions {
        jniLibs {
            useLegacyPackaging calibrawUseLegacyPackaging
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets.addGeneratedSourceDirectory(stageLegalAssets) { task ->
            objects.directoryProperty().fileValue(task.destinationDir)
        }
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ["-Xlint:deprecation"]
}

def buildRustEnabled = providers.gradleProperty("calibrawBuildRust")
    .map { it.toBoolean() }
    .getOrElse(true)

def abiTaskSuffix = { String abi ->
    abi.split(/[-_]/)
        .collect { token -> token.substring(0, 1).toUpperCase() + token.substring(1) }
        .join("")
}

def debugRustTasks = []
def releaseRustTasks = []
calibrawAbis.each { abi ->
    def suffix = abiTaskSuffix(abi)
    debugRustTasks << tasks.register("buildRustDebug${suffix}", Exec) {
        dependsOn("buildCMakeDebug[${abi}][calibraw_native_deps]")
        workingDir repositoryRoot
        environment "CALIBRAW_NATIVE_DEPS_READY", "1"
        commandLine "cargo", "xtask", "build-android", abi, "debug"
    }
    releaseRustTasks << tasks.register("buildRustRelease${suffix}", Exec) {
        dependsOn("buildCMakeRelWithDebInfo[${abi}][calibraw_native_deps]")
        workingDir repositoryRoot
        environment "CALIBRAW_NATIVE_DEPS_READY", "1"
        commandLine "cargo", "xtask", "build-android", abi, "release"
    }
}

tasks.register("buildRustDebug") {
    dependsOn(debugRustTasks)
}
tasks.register("buildRustRelease") {
    dependsOn(releaseRustTasks)
}

// The XML asset directory is produced by the external native build, and the
// Rust cdylib must exist before AGP merges JNI libraries. Wiring at merge time
// avoids a preBuild <-> externalNativeBuild dependency cycle. Native work is
// omitted when calibrawBuildRust=false so JVM-only unit tests remain host-only.
if (buildRustEnabled) {
    tasks.matching { it.name == "mergeDebugAssets" }.configureEach {
        dependsOn("externalNativeBuildDebug")
    }
    tasks.matching { it.name == "mergeReleaseAssets" }.configureEach {
        dependsOn("externalNativeBuildRelease")
    }
    tasks.matching {
        it.name == "mergeDebugNativeLibs" || it.name == "mergeDebugJniLibFolders"
    }.configureEach {
        dependsOn("buildRustDebug")
    }
    tasks.matching {
        it.name == "mergeReleaseNativeLibs" || it.name == "mergeReleaseJniLibFolders"
    }.configureEach {
        dependsOn("buildRustRelease")
    }
}
