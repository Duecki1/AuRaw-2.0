    enabled: false
    raw: REPLACE_WITH_BAYER.RAW
    sha256: REPLACE_WITH_64_HEX_SHA256
    cfa: bayer
    tags: [difficult-frequency]
    source: REPLACE_WITH_SOURCE_OR_CAPTURE_OWNER
    license: REPLACE_WITH_LICENSE
    redistributable: false
    rois:
      - {name: slanted-edge, kind: edge, rect: [0, 0, 256, 256]}
      - {name: fabric, kind: frequency, rect: [256, 0, 256, 256]}
      - {name: neutral-patch, kind: neutral, rect: [0, 256, 128, 128]}

