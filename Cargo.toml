[workspace]
resolver = "2"
members = [
    "xtask",
    "crates/auraw-core",
    "crates/auraw-gpu",
    "crates/auraw-ai",
    "crates/auraw-ui",
    "crates/auraw-ffi",
    "crates/auraw-cli",
]
default-members = [
    "crates/auraw-core",
    "crates/auraw-gpu",
    "crates/auraw-ai",
    "crates/auraw-ui",
    "crates/auraw-ffi",
    "crates/auraw-cli",
]

[workspace.metadata]
android_ndk_version = "28.2.13676358"
android_build_tools_version = "35.0.0"
android_compile_sdk = 36
android_min_sdk = 26
android_target_sdk = 36
libraw_revision = "0.22.1"
lensfun_revision = "0.3.4"
android_use_legacy_packaging = false

[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.92.0"
authors = ["Duecki <dueckis@dueckis.de>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/Duecki1/AuRaw-2.0"
readme = "README.md"

[workspace.dependencies]
auraw-core = { version = "2.0.0", path = "crates/auraw-core" }
auraw-gpu = { version = "2.0.0", path = "crates/auraw-gpu" }
auraw-ai = { version = "2.0.0", path = "crates/auraw-ai" }
auraw-ui = { version = "2.0.0", path = "crates/auraw-ui" }
auraw-ffi = { version = "2.0.0", path = "crates/auraw-ffi" }
auraw-cli = { version = "2.0.0", path = "crates/auraw-cli" }

anyhow = "1.0"
base64 = "0.22"
bytemuck = { version = "1.16", features = ["derive"] }
half = "2.7"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
jpeg-encoder = { version = "0.7.1", features = ["simd"] }
log = "0.4"
memmap2 = "0.9"
png = "0.18"
pollster = "0.4"
rayon = "1.10"
ring = "0.17.14"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
tempfile = "3.27"
toml_edit = "0.25"
ureq = { version = "3.1", default-features = false, features = ["multipart", "rustls"] }
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }

eframe = { version = "0.35", default-features = false }
egui = "0.35"
egui-phosphor = "0.13"
egui-wgpu = "0.35"
wgpu = "29"
naga = { version = "29", features = ["wgsl-in"] }
naga_oil = { version = "=0.22.0", default-features = false }

env_logger = { version = "=0.11.11", default-features = false, features = ["humantime", "regex"] }
rfd = "=0.17.2"
lcms2 = { version = "6.1.1", features = ["static"] }
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "api-18"] }

android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
jni = "0.22"
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }

bindgen = "=0.72.1"
pkg-config = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"

[profile.dev]
opt-level = 1
