[package]
name = "auraw"
version = "2.0.0"
edition = "2021"
rust-version = "1.92.0"
authors = ["Duecki <dueckis@dueckis.de>"]
description = "A GPU-first RAW image editor in Rust"
license = "GPL-3.0-or-later"
default-run = "auraw"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytemuck = { version = "1.16", features = ["derive"] }
rayon = "1.10"
log = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
png = "0.18"
anyhow = "1.0"
ureq = { version = "3.1", default-features = false, features = ["rustls"] }
ring = "0.17.14"

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.35", default-features = false, features = ["accesskit", "wgpu", "default_fonts", "wayland", "x11"] }
env_logger = "0.11"
rfd = "0.15"
pollster = "0.4"
# Exact RC pin: see DEPENDENCIES.md. Replace with stable 2.x when the required APIs are released.
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "load-dynamic", "api-18"] }


[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.35", default-features = false, features = ["wgpu", "default_fonts", "android-native-activity"] }
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
jni = "0.22"
# Exact RC pin: see DEPENDENCIES.md. Replace with stable 2.x when the required APIs are released.
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "download-binaries", "copy-dylibs", "tls-rustls", "api-18", "xnnpack"] }

# THIS SECTION IS REQUIRED FOR build.rs:
[build-dependencies]
bindgen = "0.70"
pkg-config = "0.3"

[dev-dependencies]
naga = { version = "29", features = ["wgsl-in"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"

[profile.dev]
opt-level = 1
