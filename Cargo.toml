[workspace]
resolver = "2"
members = [
    "crates/auraw-core",
    "crates/auraw-gpu",
    "crates/auraw-ai",
    "crates/auraw-ui",
    "crates/auraw-ffi",
    "crates/auraw-cli",
]
default-members = [
    "crates/auraw-core",
    "crates/auraw-gpu",
    "crates/auraw-ai",
    "crates/auraw-ui",
    "crates/auraw-ffi",
    "crates/auraw-cli",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.92.0"
authors = ["Duecki <dueckis@dueckis.de>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/duecki/AuRaw"

[workspace.dependencies]
auraw-core = { path = "crates/auraw-core" }
auraw-gpu = { path = "crates/auraw-gpu" }
auraw-ai = { path = "crates/auraw-ai" }
auraw-ui = { path = "crates/auraw-ui" }
auraw-ffi = { path = "crates/auraw-ffi" }
auraw-cli = { path = "crates/auraw-cli" }

anyhow = "1.0"
base64 = "0.22"
bytemuck = { version = "1.16", features = ["derive"] }
half = "2.7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4"
memmap2 = "0.9"
png = "0.18"
pollster = "0.4"
rayon = "1.10"
ring = "0.17.14"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
ureq = { version = "3.1", default-features = false, features = ["rustls"] }
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }

eframe = { version = "0.35", default-features = false }
egui = "0.35"
egui-phosphor = "0.13"
egui-wgpu = "0.35"
wgpu = "29"
naga = { version = "29", features = ["wgsl-in"] }

env_logger = { version = "=0.11.11", default-features = false, features = ["humantime", "regex"] }
rfd = "=0.17.2"
lcms2 = { version = "6.1.1", features = ["static"] }
ort = { version = "=2.0.0-rc.12", default-features = false }

android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
jni = "0.22"
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }

bindgen = "=0.72.1"
pkg-config = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"

[profile.dev]
opt-level = 1
