[package]
name = "auraw-ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "AuRaw ONNX Runtime bindings for BiRefNet, SAM 2.1, LaMa, and RAW denoise"

[dependencies]
auraw-core.workspace = true
auraw-gpu.workspace = true
anyhow.workspace = true
bytemuck.workspace = true
half.workspace = true
image.workspace = true
log.workspace = true
rayon.workspace = true
ring.workspace = true
serde.workspace = true
ureq.workspace = true
zip.workspace = true

[target.'cfg(not(target_os = "android"))'.dependencies]
ort = { workspace = true, features = ["std", "load-dynamic", "api-18"] }

[target.'cfg(target_os = "android")'.dependencies]
ort = { workspace = true, features = ["std", "download-binaries", "copy-dylibs", "tls-rustls", "api-18", "xnnpack"] }

[dev-dependencies]
pollster.workspace = true
