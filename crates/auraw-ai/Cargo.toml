[package]
name = "auraw-ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "AuRaw ONNX Runtime bindings for BiRefNet, SAM 2.1, LaMa, and RAW denoise"

[dependencies]
auraw-core.workspace = true
auraw-gpu.workspace = true
anyhow.workspace = true
bytemuck.workspace = true
half.workspace = true
hex.workspace = true
image.workspace = true
log.workspace = true
rayon.workspace = true
ring.workspace = true
serde.workspace = true
ureq.workspace = true
zip.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
ort = { workspace = true, features = ["load-dynamic", "directml", "cuda", "tensorrt"] }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { workspace = true, features = ["load-dynamic", "coreml"] }

[target.'cfg(target_os = "linux")'.dependencies]
ort = { workspace = true, features = ["load-dynamic", "cuda", "tensorrt", "rocm"] }

[target.'cfg(all(not(target_os = "android"), not(any(target_os = "windows", target_os = "macos", target_os = "linux"))))'.dependencies]
ort = { workspace = true, features = ["load-dynamic"] }

[target.'cfg(target_os = "android")'.dependencies]
ort = { workspace = true, features = ["download-binaries", "copy-dylibs", "tls-rustls", "nnapi", "xnnpack"] }

[dev-dependencies]
pollster.workspace = true
tempfile.workspace = true
