[package]
name = "auraw-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "AuRaw egui/eframe desktop and Android user interface"
build = "build.rs"

[lib]
name = "auraw"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "auraw"
path = "src/main.rs"

[dependencies]
auraw-ai.workspace = true
auraw-core.workspace = true
auraw-gpu.workspace = true
anyhow.workspace = true
egui-phosphor.workspace = true
half.workspace = true
hex.workspace = true
image.workspace = true
log.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { workspace = true, features = ["accesskit", "wgpu", "default_fonts", "wayland", "x11"] }
env_logger.workspace = true
pollster.workspace = true
rfd.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
auraw-ffi.workspace = true
eframe = { workspace = true, features = ["wgpu", "default_fonts", "android-native-activity"] }
android_logger.workspace = true
