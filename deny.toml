[graph]
all-features = true
targets = [
    "aarch64-linux-android",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-gnu",
    "x86_64-unknown-linux-gnu",
]

[licenses]
# This is deliberately an allow-list. A new dependency with a proprietary,
# noncommercial, research-only, or otherwise unreviewed license fails CI.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
    "IJG",
    "ISC",
    "MIT",
    "MIT-0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93
include-dev = true
unused-allowed-license = "allow"

[licenses.private]
ignore = false

[sources]
unknown-git = "deny"
unknown-registry = "deny"
