name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux / Rust and WGSL
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify committed source revision
        shell: bash
        run: |
          revision="$(scripts/verify-source-revision.sh)"
          echo "AURAW_REQUIRE_COMMITTED_SOURCE=1" >> "$GITHUB_ENV"
          echo "AURAW_SOURCE_REVISION=$revision" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$revision")" >> "$GITHUB_ENV"

      - name: Validate source tree
        run: python3 scripts/check-source-tree.py

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libclang-dev \
            libraw-dev \
            mesa-vulkan-drivers \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-regression.txt

      - name: Install image-regression dependencies
        run: python3 -m pip install --requirement requirements-regression.txt

      - name: Validate regression corpus and reference pins
        run: |
          python3 scripts/image_regression.py validate-corpus \
            --manifest regression/corpus.yaml --verify-files
          python3 scripts/image_regression.py validate-reference-engines \
            --config regression/reference-engines.yaml
          python3 -m pytest -q

      - name: Install pinned Rust toolchain
        run: |
          toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" \
            --profile minimal \
            --component clippy \
            --component rustfmt
          test "$(rustc --version | awk '{print $2}')" = "$toolchain"

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Parse and validate WGSL
        run: cargo test --locked compute_shaders_parse_and_validate

      - name: Run Rust tests
        run: cargo test --locked --all-targets

      - name: Run clippy
        run: cargo clippy --locked --all-targets

      - name: Smoke-test deterministic GPU regression renderer
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}/xdg-runtime
          WGPU_BACKEND: vulkan
        run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          cargo build --locked --bin auraw-regression-render
          scripts/smoke-regression-renderer.sh

      - name: Build Linux release from committed source
        run: scripts/build-linux.sh

      - name: Ensure checks did not modify source
        run: git diff --exit-code && test -z "$(git status --porcelain=v1 --untracked-files=all)"

  android:
    name: Android / arm64-v8a
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify committed source revision
        shell: bash
        run: |
          revision="$(scripts/verify-source-revision.sh)"
          echo "AURAW_REQUIRE_COMMITTED_SOURCE=1" >> "$GITHUB_ENV"
          echo "AURAW_SOURCE_REVISION=$revision" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$revision")" >> "$GITHUB_ENV"

      - name: Validate source tree
        run: python3 scripts/check-source-tree.py

      - name: Install Android host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libclang-dev

      - name: Install pinned Rust toolchain and Android target
        run: |
          toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" \
            --profile minimal \
            --component clippy \
            --component rustfmt
          rustup target add --toolchain "$toolchain" aarch64-linux-android
          test "$(rustc --version | awk '{print $2}')" = "$toolchain"

      - name: Fetch locked Android dependencies
        run: cargo fetch --locked --target aarch64-linux-android

      - name: Check Rust library for Android
        env:
          AURAW_ALLOW_NO_LIBRAW: "1"
        run: cargo check --locked --target aarch64-linux-android --lib

      - name: Run clippy for Android
        env:
          AURAW_ALLOW_NO_LIBRAW: "1"
        run: cargo clippy --locked --target aarch64-linux-android --lib

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: "8.11.1"

      - name: Install pinned Android SDK packages
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmake/3.22.1/bin" >> "$GITHUB_PATH"

      - name: Install pinned cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Build Android native library with LibRaw
        run: scripts/build-android.sh arm64-v8a release

      - name: Assemble and lint Android app
        run: >-
          gradle --no-daemon -p android
          :app:assembleDebug :app:lintDebug
          -PaurawBuildRust=false
          -PaurawAbi=arm64-v8a

      - name: Ensure checks did not modify source
        run: git diff --exit-code && test -z "$(git status --porcelain=v1 --untracked-files=all)"
